name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          : "${RELEASE_KEYSTORE_BASE64:?RELEASE_KEYSTORE_BASE64 secret is required}"
          keystore_path="$RUNNER_TEMP/release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
      - name: Build signed release
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          : "${RELEASE_STORE_PASSWORD:?RELEASE_STORE_PASSWORD secret is required}"
          : "${RELEASE_KEY_ALIAS:?RELEASE_KEY_ALIAS secret is required}"
          : "${RELEASE_KEY_PASSWORD:?RELEASE_KEY_PASSWORD secret is required}"
          version_name="${GITHUB_REF_NAME#v}"
          : "${version_name:?release tags must include a version after the v prefix}"
          ./gradlew lint testDebugUnitTest assembleRelease -PversionName="$version_name" -PversionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "MiCampus-${version_name}.apk"
          sha256sum "MiCampus-${version_name}.apk" > "MiCampus-${version_name}.apk.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "MiCampus-${version_name}.apk" "MiCampus-${version_name}.apk.sha256" --verify-tag --title "MiCampus $GITHUB_REF_NAME" --generate-notes
